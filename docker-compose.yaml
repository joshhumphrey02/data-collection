services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Path is inside the container; ./data is the mounted volume below.
      DATABASE_URL: "file:./data/dev.db"
      NODE_ENV: production
      APP_ROOT: /app
      PORT: 3000
      # Coolify injects the public URL; used for absolute links if needed.
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    # No `ports:` mapping. Coolify's proxy reaches the container over the
    # shared network and terminates TLS for the configured domain. Publishing
    # a host port would collide with anything else already bound to it.
    expose:
      - "3000"
    volumes:
      # Named volume keeps the SQLite file across redeploys.
      - data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  data:
